name: Refresh public ecosystem index

on:
  schedule:
    # Every two hours at :17 UTC; Asia/Shanghai is UTC+8.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore the latest complete SQLite database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dataset-latest >/dev/null 2>&1; then
            gh release download dataset-latest --pattern aggregator-full.sqlite3.zst --dir data --clobber
          fi
          make restore-full

      - name: Refresh versioned core dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: make core-refresh

      - name: Commit refreshed index
        run: |
          git add data/raw/api data/raw/upstreams index docs README.md
          if git diff --cached --quiet; then
            echo "No public-index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh public ecosystem index"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during push; retrying ($attempt/3)" >&2
          done
          exit 1

      - name: Publish stable latest SQLite assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="Updated from the versioned collection run at $(date -u +%Y-%m-%dT%H:%M:%SZ). The full archive retains raw JSON; aggregator.sqlite3 is the lightweight query projection."
          scripts/publish_release_assets.sh "$note"
