name: Refresh public ecosystem index

on:
  schedule:
    # Every two hours at :17 UTC; Asia/Shanghai is UTC+8.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore the latest complete SQLite database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dataset-latest >/dev/null 2>&1; then
            gh release download dataset-latest --pattern aggregator-full.sqlite3.zst --dir data --clobber
          fi
          make restore-full

      - name: Refresh versioned core dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: make core-refresh

      - name: Rebuild on latest main and commit refreshed index
        run: |
          scripts/publish_generated_commit.sh "data: refresh public ecosystem index" data/raw index docs plugin/data README.md

      - name: Publish stable latest SQLite assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="Updated from the versioned collection run at $(date -u +%Y-%m-%dT%H:%M:%SZ). The full archive retains raw JSON; aggregator.sqlite3 is the lightweight query projection."
          scripts/publish_release_assets.sh "$note"
