name: Refresh DeepSeek Harness fork network

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-index
  cancel-in-progress: false

jobs:
  refresh-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect all public fork metadata and rotate deep scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_forks.py

      - name: Compress the complete Fork-inclusive SQLite snapshot
        run: zstd -q -T0 -19 -f data/aggregator.sqlite3 -o data/aggregator-full.sqlite3.zst

      - name: Build Fork projection from the complete database
        run: python3 scripts/build_fork_index.py

      - name: Restore the lightweight public SQLite database
        run: git restore --source=HEAD --worktree -- data/aggregator.sqlite3

      - name: Rebuild ecosystem projections from the lightweight database
        run: |
          python3 scripts/build_value_matrix.py
          python3 scripts/build_index.py
          python3 scripts/build_views.py
          python3 scripts/build_trends.py
          python3 scripts/build_readme.py
          python3 scripts/validate.py

      - name: Commit refreshed Fork index
        run: |
          git add data/aggregator-full.sqlite3.zst index docs README.md
          if git diff --cached --quiet; then
            echo "No Fork-index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh DeepSeek Harness fork network"
          git push origin HEAD:main
