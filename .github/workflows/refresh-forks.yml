name: Refresh DeepSeek Harness fork network

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      deep_limit:
        description: "Forks to deep-scan in this run"
        required: false
        default: "200"
      recheck_deep:
        description: "Recheck the highest-impact Forks instead of the rotating queue"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-public-index
  cancel-in-progress: false

jobs:
  refresh-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore the latest complete SQLite database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dataset-latest >/dev/null 2>&1; then
            gh release download dataset-latest --pattern aggregator-full.sqlite3.zst --dir data --clobber
          fi
          make restore-full

      - name: Collect all public fork metadata, owner signals, and rotate deep scans
        env:
          GH_TOKEN: ${{ github.token }}
          DEEP_LIMIT: ${{ inputs.deep_limit || '200' }}
          RECHECK_DEEP: ${{ inputs.recheck_deep || 'false' }}
        run: |
          args=(--deep-limit "$DEEP_LIMIT")
          if [[ "$RECHECK_DEEP" == "true" ]]; then
            args+=(--recheck-deep)
          fi
          python3 scripts/collect_forks.py "${args[@]}"

      - name: Build Fork projection from the complete database
        run: python3 scripts/build_fork_index.py

      - name: Rebuild projections and database assets
        run: |
          make build
          make archive-full
          make public-db
          python3 scripts/validate.py

      - name: Rebuild on latest main and commit refreshed Fork index
        run: scripts/publish_generated_commit.sh "data: refresh DeepSeek Harness fork network" index docs plugin/data README.md

      - name: Publish stable latest SQLite assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="Updated from the versioned Fork collection run at $(date -u +%Y-%m-%dT%H:%M:%SZ). The full archive retains raw JSON; aggregator.sqlite3 is the lightweight query projection."
          scripts/publish_release_assets.sh "$note"
